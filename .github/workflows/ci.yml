name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze package
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Validate publish readiness
        run: flutter pub publish --dry-run

  example-desktop:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev ninja-build

      - name: Install example dependencies
        run: flutter pub get
        working-directory: example

      - name: Build Linux example
        if: runner.os == 'Linux'
        run: flutter build linux
        working-directory: example

      - name: Build macOS example
        if: runner.os == 'macOS'
        run: flutter build macos
        working-directory: example

      - name: Build Windows example
        if: runner.os == 'Windows'
        run: flutter build windows
        working-directory: example
